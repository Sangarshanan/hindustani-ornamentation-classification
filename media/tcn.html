<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ornament TCN Architecture</title>
  <style>
    body { margin: 0; padding: 24px; font-family: sans-serif; background: #fff !important; }
    @media (prefers-color-scheme: dark) { body { background: #fff !important; } }
    svg { width: 100%; max-width: 680px; display: block; margin: 0 auto; }

    /* Color ramps */
    .c-gray rect, .c-gray circle, .c-gray ellipse { fill: #F1EFE8; stroke: #000; }
    .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #EEEDFE; stroke: #534AB7; }
    .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #E1F5EE; stroke: #0F6E56; }
    .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #B4B2A9; stroke: #B4B2A9; }

    .c-gray text { fill: #000; }
    .c-purple text { fill: #3C3489; }
    .c-teal text { fill: #085041; }
    .c-coral text { fill: #B4B2A9; }

    @media (prefers-color-scheme: dark) {
      .c-gray rect, .c-gray circle, .c-gray ellipse { fill: #444441; stroke: #B4B2A9; }
      .c-purple rect, .c-purple circle, .c-purple ellipse { fill: #3C3489; stroke: #AFA9EC; }
      .c-teal rect, .c-teal circle, .c-teal ellipse { fill: #085041; stroke: #5DCAA5; }
      .c-coral rect, .c-coral circle, .c-coral ellipse { fill: #444441; stroke: #B4B2A9; }

      .c-gray text { fill: #D3D1C7; }
      .c-purple text { fill: #CECBF6; }
      .c-teal text { fill: #9FE1CB; }
      .c-coral text { fill: #F5C4B3; }
    }

    .th { font-family: sans-serif; font-size: 18px; font-weight: 700; }
    .ts { font-family: sans-serif; font-size: 15px; font-weight: 600; fill: #000000; }
    @media (prefers-color-scheme: dark) { .ts { fill: #000000; } }

    .arr { stroke: #000; stroke-width: 1.5; fill: none; }
    line.arr { stroke: #000; }
    path.arr { stroke: #000; }
  </style>
</head>
<body>
<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Input -->
<g class="c-gray">
  <rect x="240" y="30" width="200" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Input</text>
</g>
<text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">(batch, 1, T)</text>

<line x1="340" y1="104" x2="340" y2="120" class="arr" marker-end="url(#arrow)"/>

<!-- Input projection -->
<g class="c-purple">
  <rect x="215" y="120" width="250" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central">Input projection</text>
</g>
<text class="ts" x="340" y="178" text-anchor="middle" dominant-baseline="central">Conv1d(1 → 32, k=1)</text>

<line x1="340" y1="192" x2="340" y2="208" class="arr" marker-end="url(#arrow)"/>

<!-- TCN block - dashed container -->
<rect x="80" y="208" width="520" height="252" rx="12" fill="none" stroke-dasharray="6 4" stroke-width="1" stroke="#B4B2A9"/>
<text class="ts" x="340" y="232" text-anchor="middle" dominant-baseline="central">TCN — 6 residual blocks (exponential dilation)</text>

<!-- Row 1 -->
<g class="c-teal">
  <rect x="100" y="244" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="165" y="262" text-anchor="middle" dominant-baseline="central">ResBlock</text>
  <text class="ts" x="165" y="278" text-anchor="middle" dominant-baseline="central">dilation = 1</text>
</g>
<line x1="230" y1="266" x2="255" y2="266" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="255" y="244" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="262" text-anchor="middle" dominant-baseline="central">ResBlock</text>
  <text class="ts" x="320" y="278" text-anchor="middle" dominant-baseline="central">dilation = 2</text>
</g>
<line x1="385" y1="266" x2="410" y2="266" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="410" y="244" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="475" y="262" text-anchor="middle" dominant-baseline="central">ResBlock</text>
  <text class="ts" x="475" y="278" text-anchor="middle" dominant-baseline="central">dilation = 4</text>
</g>

<path d="M540 266 Q560 266 560 318 Q560 370 540 370" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Row 2 -->
<g class="c-teal">
  <rect x="410" y="348" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="475" y="366" text-anchor="middle" dominant-baseline="central">ResBlock</text>
  <text class="ts" x="475" y="382" text-anchor="middle" dominant-baseline="central">dilation = 8</text>
</g>
<line x1="410" y1="370" x2="385" y2="370" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="255" y="348" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="320" y="366" text-anchor="middle" dominant-baseline="central">ResBlock</text>
  <text class="ts" x="320" y="382" text-anchor="middle" dominant-baseline="central">dilation = 16</text>
</g>
<line x1="255" y1="370" x2="230" y2="370" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
  <rect x="100" y="348" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="165" y="366" text-anchor="middle" dominant-baseline="central">ResBlock</text>
  <text class="ts" x="165" y="382" text-anchor="middle" dominant-baseline="central">dilation = 32</text>
</g>

<path d="M165 392 L165 472 L340 472" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Pooling -->
<g class="c-gray">
  <rect x="215" y="472" width="250" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="494" text-anchor="middle" dominant-baseline="central">* Pooling</text>
</g>

<line x1="340" y1="516" x2="340" y2="536" class="arr" marker-end="url(#arrow)"/>

<!-- Classifier -->
<g class="c-purple">
  <rect x="215" y="536" width="250" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="558" text-anchor="middle" dominant-baseline="central">Linear classifier</text>
</g>
<text class="ts" x="340" y="592" text-anchor="middle" dominant-baseline="central">→ num_classes logits</text>

</svg>
</body>
</html>
